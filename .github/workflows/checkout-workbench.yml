name: Checkout development workbench
on:
  push:
    branches: [feature/unfinished-checkout-replacement]
    paths: [.github/workflows/checkout-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'svasylevskyi/scientific-research-radar' && github.ref == 'refs/heads/feature/unfinished-checkout-replacement'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - name: Package source and locked frontend test dependencies
        run: tar --exclude=.git --exclude=workbench.tgz -czf /tmp/workbench.tgz .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: checkout-workbench
          path: /tmp/workbench.tgz
          retention-days: 1
