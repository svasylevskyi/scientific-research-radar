name: Finalize public content API contract

on:
  push:
    branches:
      - feature/admin-public-content

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/admin-public-content
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ../backend
        working-directory: frontend
      - run: npm ci
        working-directory: frontend
      - run: npm run contracts:generate
        working-directory: frontend
      - name: Commit generated contract and remove temporary workflow
        run: |
          rm .github/workflows/prepare-public-content-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/types/api.generated.ts .github/workflows/prepare-public-content-contract.yml
          git diff --cached --check
          git commit -m "Generate public content API contract"
          git push origin HEAD:feature/admin-public-content
