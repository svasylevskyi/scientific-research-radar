name: Deploy development
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'base: account/UI testing; research: Run now enabled; scheduled: recurring runs enabled'
        type: choice
        options: [base, research, scheduled]
        default: base
permissions:
  contents: read
concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      backend_digest: ${{ steps.release.outputs.backend-digest }}
      web_digest: ${{ steps.release.outputs.web-digest }}
    steps:
      - name: Require main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve verified CI release
        id: release
        uses: ./.github/actions/verified-release
        with:
          release-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record selected release
        env:
          MODE: ${{ inputs.mode }}
          BACKEND_DIGEST: ${{ steps.release.outputs.backend-digest }}
          WEB_DIGEST: ${{ steps.release.outputs.web-digest }}
          DEPLOY_ENABLED: ${{ vars.DEV_SSH_DEPLOY_ENABLED }}
        run: |
          {
            echo "Selected development release: $GITHUB_SHA ($MODE)"
            echo "Backend: $BACKEND_DIGEST"
            echo "Web: $WEB_DIGEST"
            echo "Manual fallback: sudo bash infra/scripts/deploy.sh $GITHUB_SHA $MODE $BACKEND_DIGEST $WEB_DIGEST"
            if [[ "$DEPLOY_ENABLED" != true ]]; then
              echo "Development SSH deployment is disabled. No server will be contacted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    if: vars.DEV_SSH_DEPLOY_ENABLED == 'true'
    environment: development
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy and verify development
        uses: ./.github/actions/deploy-over-wireguard
        with:
          environment: development
          mode: ${{ inputs.mode }}
          deploy-host: ${{ vars.DEV_SSH_HOST }}
          deploy-user: ${{ vars.DEV_SSH_USER }}
          wg-endpoint: ${{ vars.DEV_WG_ENDPOINT }}
          wg-server-public-key: ${{ vars.DEV_WG_SERVER_PUBLIC_KEY }}
          wg-private-key: ${{ secrets.DEV_WG_PRIVATE_KEY }}
          ssh-key: ${{ secrets.DEV_SSH_KEY }}
          known-hosts: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          backend-digest: ${{ needs.release.outputs.backend_digest }}
          web-digest: ${{ needs.release.outputs.web_digest }}
          public-url: ${{ vars.DEV_PUBLIC_URL }}
