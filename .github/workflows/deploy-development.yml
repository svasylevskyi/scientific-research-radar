name: Deploy development
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'base: account/UI testing; research: Run now enabled; scheduled: recurring runs enabled'
        type: choice
        options: [base, research, scheduled]
        default: base
permissions:
  contents: read
concurrency:
  group: deploy-development
  cancel-in-progress: false
jobs:
  check-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Only deploy main
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
  checks:
    needs: check-ref
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-images
          path: ${{ runner.temp }}/verified-images
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish verified images for exact commit
        run: |
          gunzip -c "$RUNNER_TEMP/verified-images/radar-images.tar.gz" | docker load
          docker tag radar-ci-backend "ghcr.io/${GITHUB_REPOSITORY}-backend:${GITHUB_SHA}"
          docker tag radar-ci-web "ghcr.io/${GITHUB_REPOSITORY}-web:${GITHUB_SHA}"
          docker push "ghcr.io/${GITHUB_REPOSITORY}-backend:${GITHUB_SHA}"
          docker push "ghcr.io/${GITHUB_REPOSITORY}-web:${GITHUB_SHA}"
      - name: Deployment command
        env:
          MODE: ${{ inputs.mode }}
        run: |
          echo "Images published for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Run on server from /opt/radar/source:' >> "$GITHUB_STEP_SUMMARY"
          echo "sudo bash infra/scripts/deploy.sh $GITHUB_SHA $MODE" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: publish
    # Enable only after configuring WireGuard and the development environment.
    if: vars.DEV_SSH_DEPLOY_ENABLED == 'true'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
      - name: Connect deployment tunnel
        env:
          WG_PRIVATE_KEY: ${{ secrets.DEV_WG_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ vars.DEV_WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ vars.DEV_WG_ENDPOINT }}
          DEPLOY_HOST: ${{ vars.DEV_SSH_HOST }}
        run: |
          python3 infra/scripts/wireguard_config.py "$RUNNER_TEMP/radar-wireguard.conf"
          sudo install -d -m 700 /etc/wireguard
          sudo install -m 600 "$RUNNER_TEMP/radar-wireguard.conf" /etc/wireguard/wg-radar.conf
          rm -f "$RUNNER_TEMP/radar-wireguard.conf"
          sudo wg-quick up wg-radar
          python3 - <<'PY'
          import socket, time
          for attempt in range(10):
              try:
                  with socket.create_connection(("10.77.0.1", 22), timeout=2):
                      break
              except OSError:
                  if attempt == 9:
                      raise SystemExit("SSH is unreachable through WireGuard; check UDP 51820, peer keys, and server firewall.")
                  time.sleep(1)
          PY
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Request deployment
        env:
          DEPLOY_HOST: ${{ vars.DEV_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEV_SSH_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $MODE"
      - name: Remove deployment credentials and tunnel
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts "$RUNNER_TEMP/radar-wireguard.conf"
          if sudo ip link show wg-radar > /dev/null 2>&1; then
            sudo wg-quick down wg-radar || sudo ip link delete wg-radar
          fi
          sudo rm -f /etc/wireguard/wg-radar.conf
