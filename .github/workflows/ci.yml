name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev,postgres]'
      - name: Configure database
        env:
          DATABASE_KIND: ${{ matrix.database }}
        run: |
          if [ "$DATABASE_KIND" = postgres ]; then
            echo 'DATABASE_URL=postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test' >> "$GITHUB_ENV"
            echo 'TEST_DATABASE_URL=postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test' >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/radar-migrations.db" >> "$GITHUB_ENV"
          fi
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and test stack, backup, and restore
        run: bash infra/scripts/ci-smoke.sh
