name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  # Superseded PR checks can stop; merged commits must finish publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s infra/tests -v
  backend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Type-check billing, research, and offline evaluation
        run: python -m mypy
      - name: Validate draft research benchmark structure
        run: python -m app.evaluation validate --benchmark evaluation/benchmarks/research_support_v1.json
  backend:
    name: backend (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test
      TEST_DATABASE_URL: postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      # Temporary rollout comparison; removed after sequential/parallel validation.
      - name: PostgreSQL regression tests (sequential baseline)
        run: python -m pytest --durations=20 --junitxml=sequential-results.xml
      - name: Summarize sequential baseline
        if: always()
        run: python scripts/summarize_tests.py sequential-results.xml "$GITHUB_STEP_SUMMARY"
      - name: PostgreSQL regression tests (two isolated workers)
        run: python -m pytest -n 2 --dist=loadscope --durations=20 --junitxml=test-results.xml
      - name: Summarize test and fixture timings
        if: always()
        run: python scripts/summarize_tests.py test-results.xml "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: postgres-test-results
          path: backend/test-results.xml
          retention-days: 7
          if-no-files-found: ignore
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ../backend
      - run: npm ci
      - name: Verify generated API contracts
        run: npm run contracts:check
      - run: node --test tests/*.test.mjs
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          load: true
          tags: radar-ci-backend
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=radar-backend
          cache-to: type=gha,scope=radar-backend,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          load: true
          tags: radar-ci-web
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=radar-web
          cache-to: type=gha,scope=radar-web,mode=max
      - name: Test built images, stack, backup, and restore
        run: bash infra/scripts/ci-smoke.sh --prebuilt
      - name: Save verified images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save radar-ci-backend radar-ci-web | gzip -1 > "$RUNNER_TEMP/radar-images.tar.gz"
      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/radar-images.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [deployment-config, backend-static, backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/tested-images
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested images and record their digests
        run: bash infra/scripts/publish-images.sh "$RUNNER_TEMP/tested-images/radar-images.tar.gz" "$RUNNER_TEMP/verified-release.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error
