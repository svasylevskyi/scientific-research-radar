name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  # Superseded PR checks can stop; merged commits must finish publication.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s infra/tests -v
  backend-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Type-check billing, research, and offline evaluation
        run: python -m mypy
      - name: Validate draft research benchmark structure
        run: python -m app.evaluation validate --benchmark evaluation/benchmarks/research_support_v1.json
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev,postgres]'
      - name: Configure database
        env:
          DATABASE_KIND: ${{ matrix.database }}
        run: |
          if [ "$DATABASE_KIND" = postgres ]; then
            echo 'DATABASE_URL=postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test' >> "$GITHUB_ENV"
            echo 'TEST_DATABASE_URL=postgresql+psycopg://radar:ci-only-password@localhost:5432/radar_test' >> "$GITHUB_ENV"
          else
            echo "DATABASE_URL=sqlite:///$RUNNER_TEMP/radar-migrations.db" >> "$GITHUB_ENV"
          fi
      - name: Migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ../backend
      - run: npm ci
      - name: Verify generated API contracts
        run: npm run contracts:check
      - run: node --test tests/*.test.mjs
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: radar-ci-backend
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=radar-backend
          cache-to: type=gha,scope=radar-backend,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: radar-ci-web
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=radar-web
          cache-to: type=gha,scope=radar-web,mode=max
      - name: Test built images, stack, backup, and restore
        run: bash infra/scripts/ci-smoke.sh --prebuilt
      - name: Save verified images for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save radar-ci-backend radar-ci-web | gzip -1 > "$RUNNER_TEMP/radar-images.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/radar-images.tar.gz
          compression-level: 0
          overwrite: true
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [deployment-config, backend-static, backend, frontend, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-images-${{ github.sha }}
          path: ${{ runner.temp }}/tested-images
      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish the tested images and record their digests
        run: bash infra/scripts/publish-images.sh "$RUNNER_TEMP/tested-images/radar-images.tar.gz" "$RUNNER_TEMP/verified-release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error
