name: Deploy production
run-name: Deploy production · ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      backend_digest: ${{ steps.release.outputs.backend-digest }}
      web_digest: ${{ steps.release.outputs.web-digest }}
    steps:
      - name: Require main
        run: '[[ "$GITHUB_REF" == refs/heads/main ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve verified CI release
        id: release
        uses: ./.github/actions/verified-release
        with:
          release-sha: ${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record selected release
        env:
          BACKEND_DIGEST: ${{ steps.release.outputs.backend-digest }}
          WEB_DIGEST: ${{ steps.release.outputs.web-digest }}
          DEPLOY_ENABLED: ${{ vars.PROD_SSH_DEPLOY_ENABLED }}
        run: |
          {
            echo "Selected production release: $GITHUB_SHA"
            echo "Backend: $BACKEND_DIGEST"
            echo "Web: $WEB_DIGEST"
            if [[ "$DEPLOY_ENABLED" != true ]]; then
              echo "Production SSH deployment is disabled. No server will be contacted."
              echo "Complete docs/production-deployment-setup.md, then enable PROD_SSH_DEPLOY_ENABLED."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: release
    if: vars.PROD_SSH_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://getresearchradar.com
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy and verify production
        uses: ./.github/actions/deploy-over-wireguard
        with:
          environment: production
          mode: scheduled
          deploy-host: ${{ vars.PROD_SSH_HOST }}
          deploy-user: ${{ vars.PROD_SSH_USER }}
          wg-endpoint: ${{ vars.PROD_WG_ENDPOINT }}
          wg-server-public-key: ${{ vars.PROD_WG_SERVER_PUBLIC_KEY }}
          wg-private-key: ${{ secrets.PROD_WG_PRIVATE_KEY }}
          ssh-key: ${{ secrets.PROD_SSH_KEY }}
          known-hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          backend-digest: ${{ needs.release.outputs.backend_digest }}
          web-digest: ${{ needs.release.outputs.web_digest }}
          public-url: https://getresearchradar.com
