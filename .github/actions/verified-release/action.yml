name: Resolve verified release
description: Resolve and validate immutable images published by successful main CI.
inputs:
  release-sha:
    description: Full 40-character main commit SHA to resolve.
    required: true
  github-token:
    description: GitHub token with Actions read permission.
    required: true
outputs:
  backend-digest:
    description: Verified backend image digest.
    value: ${{ steps.manifest.outputs.backend_digest }}
  web-digest:
    description: Verified web image digest.
    value: ${{ steps.manifest.outputs.web_digest }}
runs:
  using: composite
  steps:
    - name: Find successful CI for the requested main commit
      id: ci
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_SHA: ${{ inputs.release-sha }}
      run: |
        set -Eeuo pipefail
        if [[ "$RELEASE_SHA" == "$GITHUB_SHA" && "$GITHUB_REF" == refs/heads/main ]]; then
          python3 infra/scripts/ci_release.py find
        else
          python3 infra/scripts/ci_release.py find-sha --release-sha "$RELEASE_SHA"
        fi
    - name: Download verified release manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.ci.outputs.artifact }}
        path: ${{ runner.temp }}/verified-release
        github-token: ${{ inputs.github-token }}
        run-id: ${{ steps.ci.outputs.run_id }}
    - name: Validate release identity and image digests
      id: manifest
      shell: bash
      env:
        RELEASE_SHA: ${{ inputs.release-sha }}
        CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        CI_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
      run: |
        set -Eeuo pipefail
        python3 infra/scripts/ci_release.py validate           --release-sha "$RELEASE_SHA"           --manifest "$RUNNER_TEMP/verified-release/verified-release.json"           --run-id "$CI_RUN_ID" --run-attempt "$CI_RUN_ATTEMPT"
