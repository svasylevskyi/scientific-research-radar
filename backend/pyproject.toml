[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-research-radar-api"
version = "0.1.0"
description = "API for the Scientific Research Radar"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "SQLAlchemy>=2.0.36,<3",
  "tzdata>=2025.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "mypy>=1.15,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.radar" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Expand this list as subsequent refactoring increments type more services.
[tool.mypy]
files = [
  "app/services/billing_types.py",
  "app/services/billing_provider.py",
  "app/services/billing_payment_rules.py",
  "app/services/billing_policy.py",
  "app/services/billing_change_observation.py",
  "app/services/billing_upgrade_observation.py",
  "app/radar/runner.py",
  "app/radar/submission.py",
  "app/radar/request_execution.py",
  "app/radar/request_accounting.py",
  "app/radar/lifecycle.py",
  "app/radar/stage_inputs.py",
  "app/radar/validation.py",
  "app/radar/quality.py",
  "app/services/research_quality_service.py",
  "app/services/research_quality_settings.py",
  "app/services/manual_quality_service.py",
  "app/services/source_metadata_service.py",
  "app/services/source_verification_service.py",
  "app/sources/metadata.py",
  "app/sources/comparison.py",
  "app/sources/content_policy.py",
  "app/sources/pmc_content.py",
  "app/services/source_content_service.py",
  "app/radar/evidence.py",
  "app/evaluation",
  "app/services/benchmark_review_service.py",
  "app/schemas/benchmark_review.py",
  "app/radar/lease.py",
  "app/radar/errors.py",
  "app/repositories/digest_run_repository.py",
  "app/repositories/run_state_repository.py",
  "app/repositories/run_result_repository.py",
  "app/repositories/radar_request_repository.py",
]
follow_imports = "silent"
disallow_untyped_defs = true
check_untyped_defs = true
